name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (zero runtime dependencies)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          # pytest is a dev tool, not a dependency: the zero-dependency promise
          # is about what `pip install redoslint` drags in.
          python -m pip install pytest
          python -c "
          import subprocess, sys
          mods = subprocess.run([sys.executable, '-c', 'import redoslint.cli'], capture_output=True)
          assert mods.returncode == 0, mods.stderr.decode()
          print('cli imports cleanly with no third-party packages installed')
          "

      - name: Tests
        run: python -m pytest -q

      - name: CLI smoke
        run: |
          redoslint version
          redoslint rules | head -3
          # The demo is the visitor's first command: it must exit 0 and reach
          # every rule without arguments, network, or fixtures on disk.
          redoslint demo > /tmp/demo.txt
          python -c "
          import re
          text = open('/tmp/demo.txt', encoding='utf-8').read()
          ids = sorted(set(re.findall(r'RDS\d{3}', text)))
          print('demo rule ids:', ids)
          assert len(ids) == 9, ids
          "
          redoslint demo --json > /tmp/demo-doc.json
          # A known-bad pattern must exit 1 under --fail-on high.
          redoslint pattern "^(a+)+$" || echo "exit 1 on findings, as designed"
          # The checked-in safe fixture must stay clean even at --fail-on low.
          redoslint scan examples/safe.py --fail-on low
          # --fail-on none: these two lines are shape checks on the JSON and
          # SARIF, not gates. Without it the step dies on the (correct) exit 1.
          redoslint scan examples/vulnerable.py --json --fail-on none > /tmp/demo.json
          python -c "
          import json
          d = json.load(open('/tmp/demo.json'))
          n = sum(len(r['findings']) for r in d['reports'])
          print('demo findings:', n)
          assert n >= 9, n
          "
          redoslint scan examples/vulnerable.py --sarif /tmp/out.sarif --fail-on none
          python -c "
          import json
          d = json.load(open('/tmp/out.sarif'))
          assert d['version'] == '2.1.0', d['version']
          print('sarif results:', len(d['runs'][0]['results']))
          "

      - name: MCP manifest check
        run: |
          python -m pip install ".[mcp]"
          python -c "
          import asyncio
          from redoslint.mcp_server import build_server
          s = build_server()
          async def go():
              tools = await s.list_tools()
              return sorted(t.name for t in tools)
          names = asyncio.run(go())
          expected = sorted(['redos_scan','redos_pattern','redos_rules',
                             'redos_rule_detail','redos_sarif','redos_version'])
          assert names == expected, names
          print('mcp tools:', names)
          "

  fresh-clone:
    # Every other job installs the package before testing, which is exactly why
    # a broken `pytest` on a bare clone goes unnoticed: the src/ layout needs
    # the root conftest.py to put src/ on sys.path. Install pytest and nothing
    # else, then let the suite bootstrap itself.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - name: pytest only, no package install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: A bare clone can run its own tests
        run: python -m pytest -q

      - name: And the CLI still works from src
        run: python -c "import sys; sys.path.insert(0, 'src'); import redoslint.cli; print('cli ok')"

  demo-contract:
    # The demo is the first thing a visitor runs. Unlike the TLS/AWS siblings,
    # every rule here is reachable from checked-in text, so the contract is
    # asserted absolutely: all 9 rules must fire on examples/vulnerable.py.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Every rule fires on the demo fixture
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'src')
          from redoslint import demo

          reports, _ = demo.run_demo()
          missing = demo.missing_rules(reports)
          if missing:
              print("::error::rules unreachable from the demo:", ", ".join(missing))
              sys.exit(1)
          print("all 9 rules fire on the embedded demo fixture")
          PY
      - name: The safe fixture stays clean
        run: |
          out=$(redoslint scan examples/safe.py --fail-on low)
          echo "$out"
          echo "$out" | grep -q "no findings"

  self-scan:
    # Dogfooding: the scanner must not report its own source. A false positive
    # in your own repo is the fastest way to lose a visitor's trust.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - name: Install and self-scan
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          redoslint scan src --fail-on low

  badge-check:
    # The README test count is the first number a visitor reads. It is checked
    # here, where the optional deps are installed and every module collects,
    # rather than inside the matrix: self-skipping modules make the count
    # environment-dependent and produce a week of false alarms.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - name: Install with optional test deps
        run: |
          python -m pip install -e ".[mcp]" pytest
      - name: README test-count badge vs pytest collection
        run: |
          actual=$(python -m pytest --collect-only -q -o addopts= 2>/dev/null | grep -oE "[0-9]+ tests? collected" | grep -oE "^[0-9]+" || true)
          claimed=$(grep -oE "tests-[0-9]+%20passing" README.md | grep -oE "[0-9]+" | head -1 || true)
          echo "collected=${actual:-NOTHING} claimed=${claimed:-NONE}"
          if [ -z "$actual" ]; then
            echo "::warning::pytest collected nothing - the badge check did not run"
          elif [ "$actual" != "$claimed" ]; then
            echo "::error::README badge says $claimed but pytest collects $actual"
            exit 1
          fi
